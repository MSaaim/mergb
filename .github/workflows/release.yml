name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            dist/*.dmg
            dist/*.zip

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: dist/*.exe

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Delete existing latest release
        run: gh release delete latest --cleanup-tag -y || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: |
          mapfile -d '' FILES < <(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -print0)

          cat > notes.md << 'NOTES'
          ## Downloads

          | Platform | File | Type |
          |----------|------|------|
          NOTES

          for f in "${FILES[@]}"; do
            name=$(basename "$f")
            if [[ "$name" == *.dmg ]]; then
              echo "| **macOS** (Apple Silicon) | \`$name\` | Disk Image |" >> notes.md
            elif [[ "$name" == *.zip ]]; then
              echo "| **macOS** (Apple Silicon) | \`$name\` | ZIP Archive |" >> notes.md
            elif [[ "$name" == *.exe ]]; then
              echo "| **Windows** | \`$name\` | Installer |" >> notes.md
            fi
          done

          echo "" >> notes.md
          echo "---" >> notes.md
          echo "Built from [\`${GITHUB_SHA::7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> notes.md

          gh release create latest \
            --title "MeRGB v${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            "${FILES[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
